<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#6c63ff">
  <title>Hangout Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="inbox-panel" aria-label="Conversations">
      <header class="inbox-header">
        <div class="brand-row">
          <h1 class="brand-title">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span>Hangout Chat</span>
          </h1>
          <div class="brand-actions">
            <a class="icon-btn" href="../" title="Back to Hangout Posts" aria-label="Back to Hangout Posts" style="position:relative;">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
              <span id="back-notif-badge" class="back-notif-badge hidden"></span>
            </a>
            <button id="theme-toggle" class="icon-btn theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
              <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="new-chat-button" class="icon-btn accent" title="New message" aria-label="New message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
        </div>
        <div class="search-wrap">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="conversation-search" type="search" autocomplete="off" placeholder="Search conversations…">
          </label>
        </div>
      </header>

      <div id="signed-out-card" class="signed-out-card">
        <div class="signed-out-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <strong>Sign in to start chatting</strong>
        <p>Use your Hangout Posts account to message friends.</p>
        <button id="show-auth-button" class="btn btn-primary">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>
      </div>
      <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-panel">
      <section id="empty-state" class="empty-state">
        <div class="empty-illustration">
          <svg viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="60" fill="url(#grad1)"/>
            <defs><linearGradient id="grad1" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" stop-color="#6c63ff" stop-opacity=".15"/><stop offset="100%" stop-color="#a78bfa" stop-opacity=".3"/></linearGradient></defs>
            <rect x="28" y="35" width="64" height="42" rx="10" fill="url(#grad2)"/>
            <defs><linearGradient id="grad2" x1="28" y1="35" x2="92" y2="77"><stop offset="0%" stop-color="#6c63ff"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
            <circle cx="46" cy="56" r="4" fill="white" opacity=".9"/>
            <circle cx="60" cy="56" r="4" fill="white" opacity=".9"/>
            <circle cx="74" cy="56" r="4" fill="white" opacity=".9"/>
            <path d="M38 77l4-10h-14a6 6 0 0 1-6-6v-2a6 6 0 0 1 6-6" stroke="#6c63ff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <h2>Start a Conversation</h2>
        <p>Pick a chat from the sidebar or send a new message to someone.</p>
        <button id="empty-new-chat-button" class="btn btn-primary">
          <svg viewBox="0 0 24 24"><path d="m11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          New message
        </button>
      </section>

      <section id="active-chat" class="active-chat hidden" aria-label="Active conversation">
        <header class="chat-header">
          <button id="mobile-back-button" class="icon-btn mobile-only" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>
          <span id="chat-avatar-wrap"><img id="chat-avatar" class="avatar large" alt=""></span>
          <div class="chat-heading">
            <h2 id="chat-name">Conversation</h2>
            <p id="chat-status">Offline</p>
          </div>
          <span id="streak-badge" class="streak-badge hidden" title="Chat streak"></span>
          <button id="streak-restore-btn" class="streak-restore-btn hidden" type="button"></button>
          <button id="conversation-options-button" class="icon-btn" type="button" aria-label="Conversation options" title="Options">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </header>

        <div id="message-list" class="message-list" aria-live="polite"></div>

        <form id="message-form" class="composer">
          <div id="reply-banner" class="reply-banner hidden">
            <svg viewBox="0 0 24 24" class="reply-icon"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
            <span id="reply-banner-text"></span>
            <button id="cancel-reply-button" class="composer-cancel-btn" type="button" aria-label="Cancel reply">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div id="media-preview-banner" class="reply-banner hidden">
            <div id="media-preview-content"></div>
            <button id="cancel-media-button" class="composer-cancel-btn" type="button" aria-label="Cancel media">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="composer-row">
            <label class="attach-button" title="Attach media" aria-label="Attach media">
              <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              <input id="image-input" type="file" accept="image/*,video/*" hidden>
            </label>
            <textarea id="message-input" rows="1" maxlength="1500" placeholder="Type a message…" aria-label="Message"></textarea>
            <button id="send-button" class="send-button" type="submit" aria-label="Send message">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- NEW MESSAGE DIALOG -->
  <dialog id="people-dialog" class="dialog">
    <form method="dialog" class="dialog-card" id="people-form">
      <header class="dialog-header">
        <div class="dialog-header-icon accent-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h2 id="people-dialog-title">New Message</h2>
        <button type="button" id="toggle-group-mode" class="group-toggle-btn">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Group
        </button>
        <button class="dialog-close-btn" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <label class="search-box dialog-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="people-search" type="search" autocomplete="off" placeholder="Search people…">
      </label>
      <div id="people-list" class="people-list"></div>
      <div id="group-action-bar" class="hidden group-action-bar">
        <label class="public-group-toggle">
          <input type="checkbox" id="make-public-group">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            Public group — anyone with the link can join
          </span>
        </label>
        <button id="start-group-btn" class="btn btn-primary btn-full" type="button">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Start Group Chat
        </button>
      </div>
    </form>
  </dialog>

  <!-- AUTH DIALOG -->
  <dialog id="auth-dialog" class="dialog">
    <form id="auth-form" class="dialog-card auth-card">
      <header class="dialog-header">
        <div class="dialog-header-icon accent-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h2 id="auth-title">Sign in</h2>
        <button type="button" id="close-auth-button" class="dialog-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <p class="auth-intro">Use the same account as Hangout Posts.</p>
      <label class="field-label">
        <span class="field-text">Email</span>
        <div class="field-wrap">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input id="auth-email" type="email" autocomplete="email" placeholder="you@email.com" required>
        </div>
      </label>
      <label class="field-label">
        <span class="field-text">Password</span>
        <div class="field-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required>
        </div>
      </label>
      <p id="auth-error" class="auth-error hidden"></p>
      <button id="auth-submit" class="btn btn-primary btn-full" type="submit">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign in
      </button>
      <button id="auth-toggle" class="text-button" type="button">Need an account? Create one</button>
    </form>
  </dialog>

  <!-- CONVERSATION OPTIONS DIALOG -->
  <dialog id="conversation-dialog" class="dialog options-dialog">
    <section class="dialog-card conversation-dialog-card">
      <header class="dialog-header">
        <h2>Options</h2>
        <button id="close-conversation-dialog" type="button" class="dialog-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <!-- DM-only -->
      <button id="set-nickname-button" class="conv-action" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span class="conv-action-body"><strong>Set Nickname</strong><small>Change how this person appears to you.</small></span>
      </button>
      <!-- Group-only -->
      <button id="set-my-nickname-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="m17 3 4 4-9.5 9.5-5 1 1-5Z"/><path d="m15 5 4 4"/></svg></span>
        <span class="conv-action-body"><strong>Set My Nickname</strong><small>Change how you appear in this group.</small></span>
      </button>
      <button id="rename-group-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
        <span class="conv-action-body"><strong>Rename Group</strong><small>Change the group chat title.</small></span>
      </button>
      <label id="set-group-photo-button" class="conv-action hidden">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
        <span class="conv-action-body"><strong>Set Group Photo</strong><small>Choose a custom image for the group.</small></span>
        <input type="file" id="group-photo-input" accept="image/*" style="display:none;">
      </label>
      <button id="add-member-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span>
        <span class="conv-action-body"><strong>Add Member</strong><small>Invite someone new to this group.</small></span>
      </button>
      <button id="show-members-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="conv-action-body"><strong>Members</strong><small>See everyone in this group.</small></span>
      </button>
      <button id="manage-moderators-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <span class="conv-action-body"><strong>Manage Moderators</strong><small>Assign or remove moderators.</small></span>
      </button>
      <button id="kick-member-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg></span>
        <span class="conv-action-body"><strong>Kick Member</strong><small>Remove someone from the group.</small></span>
      </button>
      <button id="transfer-ownership-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
        <span class="conv-action-body"><strong>Transfer Ownership</strong><small>Make someone else the group creator.</small></span>
      </button>
      <button id="copy-invite-link-button" class="conv-action hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
        <span class="conv-action-body"><strong>Copy Invite Link</strong><small>Share so anyone can join this public group.</small></span>
      </button>
      <div class="conv-action-divider"></div>
      <button id="pin-conversation-button" class="conv-action" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <span class="conv-action-body"><strong id="pin-conversation-text">Pin Conversation</strong><small>Keep this chat at the top of your inbox.</small></span>
      </button>
      <button id="clear-chat-button" class="conv-action" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
        <span class="conv-action-body"><strong>Clear Messages</strong><small>Hide existing messages only for you.</small></span>
      </button>
      <button id="leave-group-button" class="conv-action danger hidden" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
        <span class="conv-action-body"><strong>Leave Group</strong><small>You can rejoin if re-added.</small></span>
      </button>
      <button id="remove-conversation-button" class="conv-action danger" type="button">
        <span class="conv-action-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></span>
        <span class="conv-action-body"><strong>Remove Conversation</strong><small>Removes it from your inbox only.</small></span>
      </button>
    </section>
  </dialog>

  <!-- APP MODAL -->
  <dialog id="app-modal" class="dialog">
    <div class="dialog-card">
      <header class="dialog-header">
        <h2 id="app-modal-title">Confirm</h2>
        <button id="app-modal-close" type="button" class="dialog-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div id="app-modal-body" class="app-modal-body"></div>
      <footer class="app-modal-footer">
        <button id="app-modal-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="app-modal-confirm" class="btn btn-primary" type="button">Confirm</button>
      </footer>
    </div>
  </dialog>

  <!-- IMAGE/VIDEO VIEWER -->
  <div id="image-viewer" class="image-viewer hidden" role="dialog" aria-label="Media viewer" aria-modal="true">
    <div class="image-viewer-backdrop" id="image-viewer-backdrop"></div>
    <div class="image-viewer-content">
      <button id="image-viewer-close" class="image-viewer-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <img id="image-viewer-img" src="" alt="Full size photo">
      <video id="image-viewer-video" src="" controls style="display:none; max-width:100%; max-height:80vh; border-radius:12px;"></video>
      <div class="image-viewer-actions">
        <a id="image-viewer-save" class="image-viewer-save-btn" download="chat-media" href="#">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save
        </a>
      </div>
    </div>
  </div>

  <div id="message-action-menu" class="message-action-menu hidden" role="menu" aria-label="Message actions"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
